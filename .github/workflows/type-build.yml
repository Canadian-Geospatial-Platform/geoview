name: Build types every Friday evening
on:
  workflow_dispatch:
  schedule:
    - cron: "42 21 * * 5"

permissions: {}

concurrency:
  group: types-publication
  cancel-in-progress: false

env:
  NODE_VERSION: "24.22.1"

jobs:
  build_types:
    name: Generate declarations
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    permissions:
      contents: read
    outputs:
      artifact_id: ${{ steps.upload.outputs.artifact-id }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
          persist-credentials: false

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: ${{ env.NODE_VERSION }}
          package-manager-cache: false

      - name: Install locked dependencies
        run: node common/scripts/install-run-rush.js install

      - name: Generate geoview-core declarations
        run: npm run generate.d.ts --prefix packages/geoview-core

      - name: Verify generated declarations
        run: |
          test -s packages/geoview-core/types/src/app.d.ts
          git diff --exit-code

      - name: Upload declarations
        id: upload
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: types-${{ github.sha }}-${{ github.run_attempt }}
          path: |
            packages/geoview-core/types
            !packages/geoview-core/types/**/*.tsbuildinfo
          if-no-files-found: error
          retention-days: 7

  update_types:
    name: Update types pull request
    needs: [build_types]
    # Manual feature-branch runs may validate declarations, but cannot publish them.
    if: github.ref == format('refs/heads/{0}', github.event.repository.default_branch)
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: write
      pull-requests: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: types
          persist-credentials: false

      - name: Require generated artifact
        env:
          ARTIFACT_ID: ${{ needs.build_types.outputs.artifact_id }}
        run: |
          [[ "$ARTIFACT_ID" =~ ^[0-9]+$ ]]

      # Replace only generated files; retain package.json and other branch metadata.
      - name: Remove old declarations
        run: |
          git ls-files -z '*.d.ts' '*.d.ts.map' '*.d.mts' '*.d.mts.map' '*.d.cts' '*.d.cts.map' '*.tsbuildinfo' |
            xargs -0 -r git rm --

      - name: Download declarations
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          artifact-ids: ${{ needs.build_types.outputs.artifact_id }}
          path: ${{ github.workspace }}
          digest-mismatch: error

      - name: Verify declarations before publication
        run: test -s src/app.d.ts

      - name: Reject superseded type snapshots
        id: revision
        env:
          SOURCE_SHA: ${{ github.sha }}
          SOURCE_BRANCH: ${{ github.event.repository.default_branch }}
        run: |
          current_sha=$(git ls-remote --exit-code origin "refs/heads/$SOURCE_BRANCH" | cut -f1)
          if [ "$current_sha" = "$SOURCE_SHA" ]; then
            echo "current=true" >> "$GITHUB_OUTPUT"
          else
            echo "::notice::Skipping superseded types $SOURCE_SHA; source is now $current_sha"
            echo "current=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Create or update types pull request
        if: steps.revision.outputs.current == 'true'
        uses: peter-evans/create-pull-request@5f6978faf089d4d20b00c7766989d076bb2fc7f1 # v8.1.1
        with:
          token: ${{ github.token }}
          branch: new-types
          base: types
          delete-branch: true
          author: github-actions[bot] <41898282+github-actions[bot]@users.noreply.github.com>
          committer: github-actions[bot] <41898282+github-actions[bot]@users.noreply.github.com>
          commit-message: Update generated types
          title: Update to types
          body: |
            Automated declarations generated from ${{ github.repository }}@${{ github.sha }}.
            An existing PR is updated in place; unchanged declarations are a successful no-op.
