name: Develop preview

on:
  workflow_dispatch:
  push:
    branches:
      - "develop"

permissions: {}

# Serialize the complete build/deploy chain; never interrupt a publishing job.
concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  install-build:
    name: Build demo files
    permissions:
      contents: read
    uses: ./.github/workflows/build.yml
    with:
      source_sha: ${{ github.sha }}

  deploy-public:
    name: Deploy public
    needs: [install-build]
    if: github.ref == 'refs/heads/develop'
    permissions:
      contents: write
    uses: ./.github/workflows/deploy.yml
    with:
      source_sha: ${{ github.sha }}
      artifact_id: ${{ needs.install-build.outputs.artifact_id }}
      folder: public
