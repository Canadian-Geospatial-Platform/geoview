name: Build Geoview

on:
  workflow_call:
    inputs:
      source_sha:
        type: string
        required: true
    outputs:
      artifact_id:
        description: Immutable build artifact from this run
        value: ${{ jobs.build.outputs.artifact_id }}

permissions: {}

env:
  NODE_VERSION: "24.22.1"

jobs:
  build:
    name: build-geoview
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    permissions:
      contents: read
    outputs:
      artifact_id: ${{ steps.upload.outputs.artifact-id }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.source_sha }}
          persist-credentials: false

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        name: Install node
        with:
          node-version: ${{ env.NODE_VERSION }}
          package-manager-cache: false

      # The bootstrap installs the Rush and pnpm versions pinned in rush.json.
      - name: Install locked dependencies
        run: node common/scripts/install-run-rush.js install

      - name: Rush Build
        run: node common/scripts/install-run-rush.js build
        env:
          # This build feeds the gh-pages develop preview, so tag the version with a '-dev.<hash>' suffix
          GEOVIEW_BUILD_IS_DEV: "true"

      - name: Verify output and record revision
        env:
          SOURCE_SHA: ${{ inputs.source_sha }}
        run: |
          test "$(git rev-parse HEAD)" = "$SOURCE_SHA"
          git diff --exit-code
          test -s packages/geoview-core/dist/cgpv-main.js
          printf '%s\n' "$SOURCE_SHA" > packages/geoview-core/dist/build-revision.txt

      - name: Upload verified preview
        id: upload
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: preview-${{ inputs.source_sha }}-${{ github.run_attempt }}
          path: packages/geoview-core/dist
          if-no-files-found: error
          retention-days: 7
