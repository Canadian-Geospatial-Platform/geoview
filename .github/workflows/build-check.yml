name: Build Geoview on PR comment lock

on:
  pull_request:
    # Deliberate maintainer-controlled build trigger; do not broaden this policy.
    types: [locked]

permissions: {}

concurrency:
  group: pr-build-${{ github.event.pull_request.number }}
  cancel-in-progress: true

env:
  NODE_VERSION: "24.22.1"

jobs:
  build:
    name: build-geoview
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    permissions:
      contents: read
    steps:
      # Keep pull_request (not pull_request_target): fork code gets no write token or secrets.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          persist-credentials: false

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        name: Install node
        with:
          node-version: ${{ env.NODE_VERSION }}
          package-manager-cache: false

      # The bootstrap installs the Rush and pnpm versions pinned in rush.json.
      - name: Install locked dependencies
        run: node common/scripts/install-run-rush.js install

      - name: Rush Build
        run: node common/scripts/install-run-rush.js build

      - name: Reject tracked source changes
        run: git diff --exit-code
