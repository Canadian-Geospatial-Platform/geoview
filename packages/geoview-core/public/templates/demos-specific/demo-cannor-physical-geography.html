<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1" />
    <title>CanNor Physical Geography Demo - Canadian Geospatial Platform Viewer</title>
    <link rel="shortcut icon" href="./favicon.ico" />
    <meta name="msapplication-TileColor" content="#da532c" />
    <meta name="msapplication-config" content="./img/browserconfig.xml" />
    <meta name="theme-color" content="#ffffff" />
    <meta name="msapplication-TileColor" content="#da532c" />
    <meta name="theme-color" content="#ffffff" />
    <link href="https://fonts.googleapis.com/css?family=Roboto|Montserrat:200,300,400,900|Merriweather" rel="stylesheet" />
    <link rel="stylesheet" href="https://fonts.googleapis.com/icon?family=Material+Icons" />
    <link rel="stylesheet" href="css/style.css" />
  </head>

  <body>
    <div id="page-header"></div>
    <div>
      <div class="back-to-main">
        <a href="./index.html?tab=specific-demos">← Back to Main</a>
      </div>

      <div class="demo-section">
        <h4>CanNor - Physical Geography Demo</h4>
        <p>Demonstration of Canadian Northern Economic Development Agency - Physical Geography in GeoView</p>
      </div>
    </div>
    <div
      id="Map1"
      class="geoview-map"
      data-lang="en"
      data-config="{
        'map': {
          'interaction': 'dynamic',
          'viewSettings': {
            'projection': 3978,
            'initialView': {
              'zoomAndCenter': [6, [-120, 65]]
            }
          },
          'basemapOptions': {
            'basemapId': 'transport',
            'shaded': true,
            'labeled': true
          },
          'listOfGeoviewLayerConfig': [
          {
            'geoviewLayerType': 'geoCore',
            'geoviewLayerId': 'fe83a604-aa5a-4e46-903c-685f8b0cc33c',
            'initialSettings': {
              'states': {
                'visible': true
              }
            }
          },
          {
            'geoviewLayerType': 'geoCore',
            'geoviewLayerId': '87127901-bd6d-46de-9142-e1362d980174',
            'initialSettings': {
              'states': {
                'visible': true
              }
            }
          },
          {
            'geoviewLayerType': 'geoCore',
            'geoviewLayerId': 'd1e2048b-ccff-5852-aaa5-b861bd55c367',
            'initialSettings': {
              'states': {
                'visible': false
              }
            }
          },
          {
            'geoviewLayerType': 'geoCore',
            'geoviewLayerId': '18752265-bda3-498c-a4ba-9dfe68cb98da',
            'initialSettings': {
              'states': {
                'visible': false
              }
            }
          }
          ]
        },
        'components': ['overview-map', 'north-arrow'],
        'navBar': ['zoom', 'fullscreen', 'home', 'measurement', 'drawer', 'basemap-select'],
        'appBar': {
          'tabs': {
            'core': ['geolocator', 'aoi-panel', 'legend', 'details', 'export', 'about-panel']
          }
        },
        'footerBar': {
          'tabs': {
            'core': ['layers', 'time-slider', 'data-table', 'guide']
          }
        },
        'theme': 'geo.ca',
        'corePackagesConfig': [
          {
            'aoi-panel': {
              'isOpen': true,
              'aoiList': [
                {
                  'imageUrl': 'https://www.canada.ca/content/dam/pco-bcp/mpo-bgp/projects/indiv/grays-bay/MPO_GraysBay_Extra1.png',
                  'aoiTitle': 'Grays Bay Road and Port',
                  'extent': [-111.4, 67.5, -110.7, 67.9]
                },
                {
                  'imageUrl': 'https://www.canada.ca/content/dam/pco-bcp/mpo-bgp/projects/indiv/mackenzie/1.png',
                  'aoiTitle': 'Mackenzie Valley Highway',
                  'extent': [-134.7, 62.8, -122.5, 68.75]
                },
                {
                  'imageUrl': 'https://www.canada.ca/content/dam/pco-bcp/mpo-bgp/projects/indiv/taltson/MPO_Taltson_Extra1.png',
                  'aoiTitle': 'Taltson Hydro Expansion',
                  'extent': [-111.44, 60.40, -111.35, 60.45]
                }
              ],
              'version': '1.0'
            }
          },
          {
            'about-panel': {
              'isOpen': true,
              'mdContent': [
                '## Grays Bay Road and Port\n\nA proposed all-season road to an Arctic deepwater port and airfield, with potential to support critical-mineral exports and northern connectivity.\n\n[Learn more about Grays Bay Road and Port](https://www.canada.ca/en/privy-council/major-projects-office/projects/national/grays-bay.html)',
                '## Mackenzie Valley Highway\n\nA proposed all-season highway connecting Wrigley to the Dempster Highway, improving year-round access for northern communities and supporting trade and resource development.\n\n[Learn more about the Mackenzie Valley Highway](https://www.canada.ca/en/privy-council/major-projects-office/projects/national/mackenzie.html)',
                '## Taltson Hydro Expansion\n\nA clean-energy project to add hydro capacity and connect the North and South Slave electrical grids with a transmission line.\n\n[Learn more about the Taltson Hydro Expansion](https://www.canada.ca/en/privy-council/major-projects-office/projects/national/taltson.html)'
              ]
            }
          },
          {
            'drawer': {
              'style': {
                'fillColor': 'rgba(0, 255, 255, 0.3)',
                'strokeColor': '#0000ff',
                'strokeWidth': 3
              },
              'activeGeom': 'Polygon',
              'geomTypes': ['Point', 'Text', 'LineString', 'Polygon', 'Circle'],
              'hideMeasurements': true
            }
          }
        ]
      }"
    ></div>
    <button type="button" class="collapsible">Configuration Snippet</button>
    <pre id="Map1CS" class="panel"></pre>

    <script src="codedoc.js"></script>
    <script>
      // insertPageHeader();

      // initialize cgpv
      cgpv.init();

      // create snippets
      window.addEventListener('load', () => {
        createCodeSnippet();
        createConfigSnippet();
      });
    </script>
  </body>
</html>
